services:
  - type: web
    name: echo-backend
    runtime: node
    rootDir: ECHO-backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Europe/Rome
      - key: DB_PATH
        value: /opt/render/project/src/echo.db
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "https://echo-frontend-nua6.onrender.com"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  - type: web
    name: echo-frontend
    runtime: node
    rootDir: ECHO-frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 3000
